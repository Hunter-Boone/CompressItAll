# cargo-about: licence inventory for the Licenses page (DESIGN.md 4.11).
# Run through `cargo xtask licenses` (tools/licenses/generate.sh); do not run by hand.
# The accepted list is DESIGN.md 7.7, in priority order: for a crate offering
# "MIT OR Apache-2.0" the first match wins, so MIT is elected.

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "IJG",
  "MPL-2.0",
  "OFL-1.1",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
]

# Same platforms as deny.toml: everything the desktop binary or the WASM engine is built for.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "wasm32-unknown-unknown",
]

# Only code that ends up in the shipped artefact: no test-only crates, no build.rs helpers (cc, cmake, bindgen).
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Workspace crates (cia-*, xtask) are publish = false and belong to us.
[private]
ignore = true
