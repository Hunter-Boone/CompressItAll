name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always
  RUSTUP_AUTO_INSTALL: "1"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: |
          sudo apt-get update
          # clang for the C codecs; the WebKitGTK/GTK dev packages because cia-desktop is a workspace member
          sudo apt-get install -y --no-install-recommends clang libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          cargo install cargo-deny --locked
          cargo install cargo-about --locked --features cli
      - run: cargo fmt --all --check
      - name: Desktop frontend (tauri's generate_context! needs frontendDist to exist)
        run: npm ci && npm run build:frontend -w apps/desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo deny check licenses bans sources
      - name: npm checks
        run: |
          npm ci
          npm run typecheck
          npm run lint
      - name: Generated files are current
        run: |
          cargo xtask presets-doc
          cargo xtask types
          git diff --exit-code -- docs/presets-sources.md packages/engine-client/src/generated || { echo "::error::run cargo xtask presets-doc && cargo xtask types and commit"; exit 1; }
          bash tools/licenses/generate.sh --check || { echo "::error::run cargo xtask licenses and commit"; exit 1; }

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: swatinem/rust-cache@v2
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm --no-progress -y
      - name: Install FFmpeg for video tests
        shell: bash
        run: |
          # The pinned LGPL build Smidge downloads is used once Smidge-Libraries exists (M5);
          # until then the runner's FFmpeg widens coverage for probe/verify tests, which skip when absent.
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress -y ;;
          esac
      - name: Desktop frontend
        shell: bash
        run: npm ci && npm run build:frontend -w apps/desktop
      - run: cargo test --workspace --locked
      - run: cargo build -p cia-cli --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cia-cli-${{ matrix.os }}
          path: |
            target/release/cia
            target/release/cia.exe
          if-no-files-found: ignore

  wasm:
    name: WASM engine
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Install clang, wasi-sdk, binaryen, wasm-bindgen
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang binaryen
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | sudo tar xz -C /opt
          sudo mv /opt/wasi-sdk-25.0-x86_64-linux /opt/wasi-sdk
          cargo install wasm-bindgen-cli --version "$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)" --locked
      - run: cargo xtask wasm
      - name: Size budget (12 MB uncompressed)
        run: |
          f=$(ls apps/web/public/engine/*.wasm | head -1)
          s=$(stat -c %s "$f"); echo "$f: $s bytes"; test "$s" -le 12582912
      - uses: actions/upload-artifact@v4
        with:
          name: cia-wasm
          path: apps/web/public/engine

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: swatinem/rust-cache@v2
        with:
          key: desktop
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm --no-progress -y
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend
        run: |
          npm ci
          npm run build:frontend -w apps/desktop
      # Debug build with the embedded frontend: catches build breaks on every OS without bundling.
      - run: cargo build -p cia-desktop --features custom-protocol,dev-build --locked
