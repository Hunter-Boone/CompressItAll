[package]
name = "cia-engine"
description = "Smidge orchestrator: type detection, dispatch, job runner, events, cancellation, output sinks (DESIGN.md 3.1-3.3, 3.9-3.12)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cia-core = { path = "../cia-core" }
cia-image = { path = "../cia-image" }
cia-archive = { path = "../cia-archive" }
cia-pdf = { path = "../cia-pdf" }
cia-office = { path = "../cia-office" }
cia-audio = { path = "../cia-audio", default-features = false }
cia-video-plan = { path = "../cia-video-plan" }
cia-mozjpeg = { path = "../cia-mozjpeg" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
infer = "0.16"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
cia-ffmpeg = { path = "../cia-ffmpeg", optional = true }

[features]
default = []
# Filesystem reader/sink and the temp-dir machinery (desktop and CLI).
fs = ["cia-archive/fs"]
# Native Opus encoding through libopus.
opus = ["cia-audio/opus-native"]
# FFmpeg video backend (desktop and CLI).
ffmpeg = ["dep:cia-ffmpeg", "fs"]

[dev-dependencies]
tempfile = "3"
image = { workspace = true }
cia-archive = { path = "../cia-archive" }
