[package]
name = "cia-webp"
description = "Safe WebP encoder/decoder over libwebp-sys: lossy (with alpha), lossless and near-lossless through the advanced API. Builds for native and wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
thiserror.workspace = true
# `std` only toggles libwebp-sys's own no_std attribute, but its build script
# also defines WEBP_USE_THREAD under `std`, which needs pthreads. wasm32 has
# none, so `std` is enabled for native targets only (below). Keep it that way:
# any crate enabling libwebp-sys/std for wasm32 breaks the wasm build.
libwebp-sys = { version = "0.14", default-features = false, features = ["parallel"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["parallel", "std"] }

[dev-dependencies]
image.workspace = true
